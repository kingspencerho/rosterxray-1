# WEEKLY IN-SEASON DATA REFRESH
#
# The four in-season layers are STATIC ES IMPORTS bundled at build time — there
# is no runtime fetch of grading/data anywhere in App.jsx. So the numbers a
# visitor sees are whatever was committed the last time Vercel built. Without
# this job the app renders last week's usage under a label that correctly names
# an older week, and nothing is obviously broken: it just quietly stops being
# current.
#
# WHAT THIS DOES NOT DO, ON PURPOSE
#
#   It does not push to the default branch. It opens a PR from its own
#   data/refresh-* branch and, once every guard has passed in this same job,
#   MERGES THAT PR ITSELF (his call, Oct 10 2026). The PR is the audit trail;
#   the merge is what makes the numbers reach the live site.
#   WHY IT MERGES ITSELF: from Sep 8 to Oct 6 every run failed, and the one run
#   that passed (PR #98, Sep 6) sat unmerged, so rosterxray.com served Week 1
#   game logs into Week 5. A refresh that waits on a human click is a refresh
#   that does not happen. What keeps it safe is unchanged: only grading/data may
#   change, the frozen scored file is never rebuilt, and nothing merges unless
#   the full guard chain passed first.
#
#   It does not fail silently. A failed run opens (or comments on) one GitHub
#   issue that mentions the owner, so the phone notifies; the next green run
#   closes it.
#
#   It does not touch player_metrics_2025.json. That file feeds four SCORED
#   inputs and is frozen for the whole season — refreshing it would move every
#   grade for reasons unrelated to the roster and silently invalidate every
#   calibration figure in CLAUDE.md. Guard 15 enforces that independently; this
#   job simply never asks for it.
#
#   It does not commit anything if the guards fail. A refresh that ships bad
#   data is worse than a missed week, because a missed week is visible in the
#   vintage label and bad data is not.
name: Weekly data refresh

on:
  schedule:
    # Tuesday 14:00 UTC (09:00 ET / 10:00 EDT). AFTER Monday night football has
    # settled into the nflverse releases and BEFORE Wednesday waivers process,
    # which is the window where a refreshed target-share trend is worth having.
    - cron: "0 14 * * 2"
    # Saturday 15:00 UTC (10:00 ET / 11:00 EDT) — the LATE-WEEK pass, steps 5-6
    # only. Two reasons it is Saturday rather than Sunday:
    #
    #   Friday afternoon is when the OFFICIAL PRACTICE REPORT lands, carrying
    #   every out / doubtful / questionable designation. That is the single
    #   largest information event of the week and it is settled by Saturday.
    #
    #   This job opens a PULL REQUEST. A Sunday-morning PR cannot realistically
    #   be reviewed and merged before a 13:00 ET kickoff, so a run that lands
    #   Saturday leaves a full day to merge.
    #
    # ⛔ NOTHING SCHEDULED CAN CATCH FINAL INACTIVES. They land 90 minutes
    # before kickoff and no PR-based flow reaches a built page in that window.
    # This pass is the practice report, not the last word.
    - cron: "0 15 * * 6"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to refresh (defaults to 2026)"
        required: false
        default: "2026"
      live_only:
        description: "Steps 5-6 only (status + game lines). Leave false for a full refresh."
        required: false
        type: boolean
        default: false

# Least privilege: write the branch, open the PR, nothing else.
permissions:
  contents: write
  pull-requests: write
  issues: write        # the failure notice and its auto-close

concurrency:
  group: weekly-data-refresh-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every in-season builder is Python STDLIB ONLY (csv, gzip, json, re) —
      # verified, and worth keeping that way. nflreadpy is needed for the ANNUAL
      # layers and deliberately not for this job, so the weekly run has no pip
      # step and nothing to break on a dependency release.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # WHICH PASS IS THIS? Derived from the schedule that fired rather than
      # from a second workflow file — two files would be two places to keep the
      # guard list, the frozen-file rule and the PR body in step, which is the
      # duplicate-definition class this repo has paid for repeatedly.
      - name: Decide the pass
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LIVE="${{ inputs.live_only }}"
          elif [ "${{ github.event.schedule }}" = "0 15 * * 6" ]; then
            LIVE="true"
          else
            LIVE="false"
          fi
          echo "live=$LIVE" >> "$GITHUB_OUTPUT"
          [ "$LIVE" = "true" ] && echo "Late-week pass: steps 5-6 only." \
                               || echo "Full pass: all six steps."

      - name: Refresh the in-season layers
        id: refresh
        run: |
          ARGS="${{ inputs.season || '2026' }}"
          [ "${{ steps.mode.outputs.live }}" = "true" ] && ARGS="$ARGS --live-only"
          bash scripts/refresh-inseason.sh $ARGS | tee refresh.log
          # ⚠️ refresh-inseason.sh ALWAYS exits 0 — "nothing published yet" is
          # its normal pre-season outcome and is not a failure. The real signal
          # is whether the committed JSON actually changed, so the decision is
          # made from the diff below rather than from an exit code.
          {
            echo "log<<REFRESH_LOG"
            cat refresh.log
            echo "REFRESH_LOG"
          } >> "$GITHUB_OUTPUT"

      - name: Did any data actually change?
        id: diff
        run: |
          # Scoped to grading/data on purpose: if the job ever dirties anything
          # else, that is a bug and this refuses to carry it into the PR.
          if git diff --quiet -- grading/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changed — nothing published since the last run."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- grading/data
          fi
          outside=$(git status --porcelain | grep -v '^.. grading/data/' | grep -v '^?? refresh.log' || true)
          if [ -n "$outside" ]; then
            echo "::error::Refresh modified files outside grading/data:"; echo "$outside"; exit 1
          fi

      # THE GUARDS GATE THE COMMIT. If any one of them fails, the job stops here
      # and no PR is opened — the stale data stays live, which is the safe
      # direction to fail because its vintage label still tells the truth.
      #
      # RXR_DATA_REFRESH turns guard 41's CALENDAR rule (a role claim older than
      # 7 days) into a report for the PR body instead of a failure. It is the only
      # guard that goes red on the date alone, and the prose it reads is App.jsx,
      # which this job never touches, so it was blocking the data for something
      # the data did not cause. Every other guard, including guard 41's
      # permanence rule, still gates the commit.
      - name: Run the guards
        if: steps.diff.outputs.changed == 'true'
        env:
          RXR_DATA_REFRESH: "1"
          RXR_ADVISORY_OUT: .git/PROSE_ADVISORY
        run: npm test

      - name: Open the refresh PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # ⚠️ The pass goes in the branch name. Both runs land in the same ISO
          # week, so a shared name would make Saturday force-push over Tuesday's
          # unmerged PR and silently lose the full refresh.
          SUFFIX=$([ "${{ steps.mode.outputs.live }}" = "true" ] && echo "-live" || echo "")
          BR="data/refresh-$(date -u +%Y-W%V)$SUFFIX"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BR"
          git add grading/data

          # ⚠️ The message and body are built with printf, NOT an indented
          # heredoc. A heredoc nested inside a YAML block scalar has to close at
          # column 0 to terminate, which is impossible at this indent level —
          # the first version of this step would have swallowed the rest of the
          # script and baked leading spaces into every line it did emit.
          {
            printf '%s\n\n' "Weekly in-season data refresh ($(date -u +%Y-%m-%d))"
            printf '%s\n' "Context layers only. player_metrics_2025.json is frozen and untouched," \
                           "so no grade can move. All guards passed before this commit was made." "" \
                           "Refresh log:"
            sed 's/^/  /' refresh.log
          } > .git/COMMIT_BODY
          git commit -F .git/COMMIT_BODY

          git push -f origin "$BR"

          # ⚠️ DERIVED, never hand-typed. This line used to carry a literal
          # count, and it was already stale by two the first time the job ran
          # for real — a hard-coded number in a body nobody re-reads is exactly
          # the duplicate-definition class this repo keeps hitting. The test
          # chain in package.json is the single source of the count, and guard
          # 15 fails the build if a literal reappears anywhere in this file.
          GUARDS=$(node -e "const s=require('./package.json').scripts.test;console.log((s.match(/[.]mjs/g)||[]).length)")

          {
            printf '%s\n' \
              "Automated in-season refresh of the **context-only** data layers." "" \
              "- \`snap_trajectory\` · \`qb_profile\` · \`gamelogs\` · \`volume\` (usage trajectory) · \`status\`" \
              "- **\`player_metrics_2025.json\` is frozen and untouched** — it feeds four scored inputs, so no grade can move from this PR." \
              "- All $GUARDS guards passed before the commit was made; the job refuses to open a PR if any fail." "" \
              "Merging is what makes these numbers reach the live site: the data files are static imports bundled at build time, so nothing updates until Vercel rebuilds." "" \
              "<details><summary>Refresh log</summary>" ""
            printf '```\n'; cat refresh.log; printf '```\n'
            printf '\n%s\n' "</details>"
            if [ -s .git/PROSE_ADVISORY ]; then
              printf '\n%s\n\n' "**Player notes to re-source** (old role claims; reported, not blocking):"
              cat .git/PROSE_ADVISORY
            fi
          } > .git/PR_BODY

          # Reuse this week's PR if the job runs twice.
          if gh pr view "$BR" --json number >/dev/null 2>&1; then
            gh pr edit "$BR" --body-file .git/PR_BODY
          else
            gh pr create --base "$BASE" --head "$BR" \
              --title "Weekly data refresh · $(date -u +%Y-%m-%d)" \
              --body-file .git/PR_BODY
          fi

          # MERGE IT. The guards already passed in this job and the scope check
          # already proved only grading/data changed, so a human click adds a
          # delay and no information. Squash keeps main's history one line per
          # refresh. The merge is what triggers the Vercel rebuild.
          gh pr merge "$BR" --squash --delete-branch

      # A FAILURE MUST REACH A PERSON. GitHub's own email for a failed scheduled
      # run went unread for eight straight weeks, so this opens ONE issue (then
      # comments on it), mentioning the owner so the phone notifies.
      - name: Report a failed refresh
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
        run: |
          N=$(gh issue list --state open --label refresh-failure --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$N" ]; then
            gh issue comment "$N" --body "Failed again: $RUN"
          else
            gh label create refresh-failure --color B60205 --force >/dev/null 2>&1 || true
            gh issue create --title "Weekly data refresh is failing" --label refresh-failure \
              --body "@$OWNER the scheduled data refresh failed, so the live site's game logs and usage numbers are not updating. Run: $RUN"
          fi

      - name: Close the failure notice once a run succeeds
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for N in $(gh issue list --state open --label refresh-failure --json number -q '.[].number' 2>/dev/null); do
            gh issue close "$N" --comment "Refresh succeeded: $RUN"
          done
